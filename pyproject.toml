[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_packs*", "lisa_packs.tavily*"]

[tool.setuptools.package-data]
"lisa_packs" = ["*"]
"lisa_packs.tavily" = ["tools/**/*.yml"]

[project]
name = "lisa-pack-tavily"
version = "0.1.0"
description = "Lisa Tavily search provider pack - concrete tavily_search tool implementation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["lisa_packs/tavily/tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
]

[project.entry-points."lisa.extensions.content_roots"]
tavily = "lisa_packs.tavily:get_content_root"